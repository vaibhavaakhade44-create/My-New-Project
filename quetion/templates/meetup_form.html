<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meetup Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --page: #0b1014;
      --panel: #141d22;
      --line: #2b3a40;
      --text: #edf4f2;
      --muted: #a2b2b0;
      --accent: #52d6b2;
      --accent-dark: #102e29;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 18px 56px;
      background: radial-gradient(ellipse at 50% 0%, #18302d 0, var(--page) 48%);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
    }

    .page { width: min(100%, 680px); margin: 0 auto; }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }

    .brand { font-size: 16px; font-weight: 700; }
    .back-link { color: var(--muted); font-size: 14px; text-decoration: none; }
    .back-link:hover { color: var(--accent); }

    .intro { margin-bottom: 24px; }
    .eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; text-transform: uppercase; }
    h1 { margin: 8px 0; font-size: 32px; line-height: 1.15; }
    .intro p { margin: 0; color: var(--muted); line-height: 1.6; }

    form {
      padding: 28px;
      border: 1px solid var(--line);
      border-top: 3px solid var(--accent);
      border-radius: 8px;
      background: var(--panel);
    }

    .field { margin-bottom: 22px; }
    label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
    .required { color: var(--accent); }
    .hint { display: block; margin-top: 6px; color: var(--muted); font-size: 12px; }

    input, select, textarea {
      width: 100%;
      min-height: 46px;
      padding: 11px 13px;
      border: 1px solid #405158;
      border-radius: 5px;
      background: #0e1519;
      color: var(--text);
      font: inherit;
    }

    textarea { min-height: 96px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

    button {
      min-height: 46px;
      padding: 0 20px;
      border: 0;
      border-radius: 5px;
      background: var(--accent);
      color: #09221c;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.08); }
    #form-message { min-height: 24px; margin: 14px 0 0; color: var(--accent); font-size: 14px; }

    @media (max-width: 520px) {
      body { padding: 20px 14px 36px; }
      form { padding: 22px 18px; }
      h1 { font-size: 28px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="topbar">
      <div class="brand">Community Meetup</div>
      <a class="back-link" href="/">Back to quiz</a>
    </header>

    <section class="intro">
      <div class="eyebrow">Registration</div>
      <h1>Meetup Registration</h1>
      <p>Tell us a little about yourself and what you are building.</p>
    </section>

    <form id="meetup-form">
      <div class="field">
        <label for="full_name">Full name <span class="required">*</span></label>
        <input id="full_name" name="full_name" type="text" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="whatsapp_number">WhatsApp number <span class="required">*</span></label>
        <input id="whatsapp_number" name="whatsapp_number" type="tel" autocomplete="tel" required>
      </div>

      <div class="field">
        <label for="working_on">What are you working on? <span class="required">*</span></label>
        <textarea id="working_on" name="working_on" required></textarea>
      </div>

      <div class="field">
        <label for="role">Your role <span class="required">*</span></label>
        <select id="role" name="role" required>
          <option value="" selected disabled>Select your role</option>
          <option>Founder</option>
          <option>Developer</option>
          <option>Designer</option>
          <option>Student</option>
          <option>Other</option>
        </select>
      </div>

      <div class="field">
        <label for="looking_for">What are you looking for? <span class="required">*</span></label>
        <select id="looking_for" name="looking_for" required>
          <option value="" selected disabled>Select one</option>
          <option>Funding</option>
          <option>Co-founder</option>
          <option>Mentorship</option>
          <option>Networking</option>
          <option>Customers</option>
          <option>Other</option>
        </select>
      </div>

      <div class="field">
        <label for="attendance">Will you attend? <span class="required">*</span></label>
        <select id="attendance" name="attendance" required>
          <option value="" selected disabled>Select an answer</option>
          <option>Yes</option>
          <option>No</option>
          <option>Maybe</option>
        </select>
      </div>

      <div class="field">
        <label for="biggest_problem">What is your biggest problem right now?</label>
        <textarea id="biggest_problem" name="biggest_problem"></textarea>
        <span class="hint">Optional</span>
      </div>

      <button type="submit">Preview registration</button>
      <p id="form-message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    document.querySelector('#meetup-form').addEventListener('submit', (event) => {
      event.preventDefault();
      document.querySelector('#form-message').textContent = 'This is a frontend-only preview. The form does not save data.';
    });
  </script>
</body>
</html>
